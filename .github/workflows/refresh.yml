name: Refresh website sources
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autonomous-media-lab-imports
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out updater
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify request signing
        run: python3 -m unittest discover -s tests -v
      - name: Refresh YouTube, podcast and Suno
        env:
          AML_UPDATE_SECRET: ${{ secrets.AML_UPDATE_SECRET }}
        run: python3 scripts/refresh.py
