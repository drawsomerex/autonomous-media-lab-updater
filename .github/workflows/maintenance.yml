name: Maintain scheduled updater
on:
  schedule:
    - cron: '19 4 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out updater
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Record monthly maintenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance.py
